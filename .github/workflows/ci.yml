name: Check SixthStep
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:catalogue
      - run: npm run typecheck
      # Guards against the README silently claiming a stale test count. Kept as a
      # separate step so a docs-only change fails here rather than after a build.
      - run: npm run check:readme-counts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --max-failures=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: test-results/
          retention-days: 7
